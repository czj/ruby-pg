name: timestamp decoder bench
on: push
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: bench }
      - uses: actions/checkout@v4
        with: { repository: czj/ruby-pg, ref: perf/text-timestamp-without-timegm-windows-local, path: patched }
      - uses: actions/checkout@v4
        with: { repository: ged/ruby-pg, ref: v1.7.0, path: baseline }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "4.0" }
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libpq-dev
      - if: runner.os == 'macOS'
        run: brew install libpq && echo "$(brew --prefix libpq)/bin" >> $GITHUB_PATH
      - if: runner.os == 'Windows'
        shell: cmd
        run: ridk exec sh -c "pacman --sync --needed --noconfirm ${MINGW_PACKAGE_PREFIX}-gcc ${MINGW_PACKAGE_PREFIX}-postgresql"
      - if: runner.os != 'Windows'
        run: bash bench/run.sh
      - if: runner.os == 'Windows'
        shell: cmd
        run: ridk exec bash bench/run.sh
